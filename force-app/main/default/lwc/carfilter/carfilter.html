<template>
    <lightning-card title="Filters" icon-name="standard:calibration">
        <div class="slds-m-horizontal_medium">
            <lightning-input
                type="search"
                label="Search Key"
                onchange={handleSearchKeyChange}
                value={filters.searchKey}>
            </lightning-input>

            <section>
                <lightning-slider
                    label="Max Price"
                    min="0"
                    max="9999999"
                    step="100"
                    value={filters.maxPrice}
                    onchange={handleMaxPriceChange}>
                </lightning-slider>
            </section>

            <section>
                <h2>Category</h2>

                <template if:true={categories.data}>
                    <template
                        for:each={categories.data.values}
                        for:item="category">
                        <lightning-input
                            key={category.value}
                            type="checkbox"
                            onchange={handleCategoryChange}
                            label={category.label}
                            data-name="category"
                            data-value={category.value}
                            checked>
                        </lightning-input>
                    </template>
                </template>

                <template if:true={categories.error}>
                    <div class="slds-text-color_error">
                        {categoryError}
                    </div>
                </template>
            </section>

            <section>
                <h2>Make</h2>

                <template if:true={makeTypes.data}>
                    <template
                        for:each={makeTypes.data.values}
                        for:item="make">
                        <lightning-input
                            key={make.value}
                            type="checkbox"
                            onchange={handleMakeChange}
                            label={make.label}
                            data-name="makeType"
                            data-value={make.value}
                            checked>
                        </lightning-input>
                    </template>
                </template>

                <template if:true={makeTypes.error}>
                    <div class="slds-text-color_error">
                        {makeError}
                    </div>
                </template>
            </section>
        </div>
    </lightning-card>
</template>
